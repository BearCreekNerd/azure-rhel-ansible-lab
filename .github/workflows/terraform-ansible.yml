name: Terraform + Ansible

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**/*.tf"
      - "ansible/**/*.yml"
      - ".github/workflows/terraform-ansible.yml"

permissions:
  contents: read
  id-token: write

jobs:
  provision-and-configure:
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: true
      TF_VAR_ssh_public_key: ${{ secrets.TF_VAR_ssh_public_key }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Compute remote state backend names
        shell: bash
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          sanitized_repo_name="$(echo "$repo_name" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9')"
          storage_name_prefix="${sanitized_repo_name:0:14}"
          subscription_suffix="$(echo "${{ secrets.AZURE_SUBSCRIPTION_ID }}" | tr -d '-' | tr '[:upper:]' '[:lower:]' | cut -c1-8)"

          if [ -z "$storage_name_prefix" ]; then
            storage_name_prefix="tfstate"
          fi

          echo "TF_STATE_RESOURCE_GROUP=rg-${repo_name}-tfstate" >> "$GITHUB_ENV"
          echo "TF_STATE_STORAGE_ACCOUNT=st${storage_name_prefix}${subscription_suffix}" >> "$GITHUB_ENV"
          echo "TF_STATE_CONTAINER=tfstate" >> "$GITHUB_ENV"
          echo "TF_STATE_KEY=${repo_name}.tfstate" >> "$GITHUB_ENV"

      - name: Ensure Azure remote state backend exists
        shell: bash
        run: |
          az group create \
            --name "$TF_STATE_RESOURCE_GROUP" \
            --location eastus

          az storage account create \
            --name "$TF_STATE_STORAGE_ACCOUNT" \
            --resource-group "$TF_STATE_RESOURCE_GROUP" \
            --location eastus \
            --sku Standard_LRS \
            --kind StorageV2 \
            --https-only true \
            --min-tls-version TLS1_2 \
            --allow-blob-public-access false

          state_access_key="$(az storage account keys list \
            --account-name "$TF_STATE_STORAGE_ACCOUNT" \
            --resource-group "$TF_STATE_RESOURCE_GROUP" \
            --query '[0].value' \
            --output tsv)"

          echo "::add-mask::$state_access_key"
          echo "TF_STATE_ACCESS_KEY=$state_access_key" >> "$GITHUB_ENV"

          az storage container create \
            --name "$TF_STATE_CONTAINER" \
            --account-name "$TF_STATE_STORAGE_ACCOUNT" \
            --account-key "$state_access_key" \
            --auth-mode key

      - name: Write SSH keys for Terraform and Ansible
        shell: bash
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "${{ secrets.TF_VAR_ssh_public_key }}" > "$HOME/.ssh/id_ed25519.pub"
          chmod 644 "$HOME/.ssh/id_ed25519.pub"

      - name: Terraform init
        shell: bash
        run: |
          terraform init -reconfigure \
            -backend-config="resource_group_name=$TF_STATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TF_STATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TF_STATE_CONTAINER" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="access_key=$TF_STATE_ACCESS_KEY"

      - name: Terraform validate
        shell: bash
        run: terraform validate

      - name: Terraform plan
        shell: bash
        run: terraform plan -out tfplan

      - name: Terraform apply
        shell: bash
        run: terraform apply -auto-approve tfplan

      - name: Capture Terraform outputs
        id: tf_outputs
        shell: bash
        run: |
          echo "vm_public_ip=$(terraform output -raw vm_public_ip)" >> "$GITHUB_OUTPUT"
          echo "admin_username=$(terraform output -raw admin_username)" >> "$GITHUB_OUTPUT"

      - name: Add VM host key to known_hosts
        shell: bash
        run: |
          ssh-keygen -R "${{ steps.tf_outputs.outputs.vm_public_ip }}" || true
          ssh-keyscan -H "${{ steps.tf_outputs.outputs.vm_public_ip }}" >> "$HOME/.ssh/known_hosts"

      - name: Wait for SSH availability
        shell: bash
        run: |
          for i in {1..30}; do
            if ssh \
              -i "$HOME/.ssh/id_ed25519" \
              -o BatchMode=yes \
              -o ConnectTimeout=10 \
              "${{ steps.tf_outputs.outputs.admin_username }}@${{ steps.tf_outputs.outputs.vm_public_ip }}" \
              "echo ready"; then
              exit 0
            fi
            echo "SSH not ready yet, retrying... ($i/30)"
            sleep 10
          done
          echo "Timed out waiting for SSH"
          exit 1

      - name: Install Ansible
        shell: bash
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ansible

      - name: Build dynamic Ansible inventory
        shell: bash
        run: |
          cat > ansible/inventory.ci.ini <<EOF
          [rhel]
          rhel-safe ansible_host=${{ steps.tf_outputs.outputs.vm_public_ip }} ansible_user=${{ steps.tf_outputs.outputs.admin_username }} ansible_ssh_private_key_file=$HOME/.ssh/id_ed25519 ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
          EOF
      - name: Run Ansible update playbook
        shell: bash
        run: ansible-playbook -i ansible/inventory.ci.ini ansible/update-rhel-playbook.yml
    
      - name: Run Ansible setup playbook
        shell: bash
        run: ansible-playbook -i ansible/inventory.ci.ini ansible/setup-golang-dotnet10.yml
